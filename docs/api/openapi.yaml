openapi: 3.1.0
info:
  title: Poker Friends REST API
  version: 0.1.0
  description: |
    Đặc tả REST (bắt đầu từ đợt B3). Mỗi thao tác có `x-phase` cho biết đợt nào cài:

    - `B4`: cần để chơi realtime (vào ghế, rời ghế, lấy snapshot).
    - `B6`: tài khoản (`/api/auth/`, tag `auth`) — **đã cài**.
    - `B7`: phòng và quyền (lobby, tạo/xem phòng, link mời, quyền chủ phòng) — **đã cài**.
    - `B8`: chat, lịch sử ván, replay, bảng lời/lỗ (tag `history`) — **đã cài**. Người có quyền
      xem phòng (như `getRoom`) xem được; staff có quyền chủ phòng ở mọi phòng.
    - `F`: phản hồi của người chơi và lỗi trình duyệt cho buổi beta (tag `feedback`) — **đã cài**.
      Chỉ ghi; không có endpoint đọc, người quản trị xem trong Django admin.

    Đăng nhập dùng cookie phiên của Django (`sessionid`). Mọi request không phải GET gửi header
    `X-CSRFToken` bằng giá trị cookie `csrftoken` (gọi `GET /api/auth/config/` để có cookie này),
    **kể cả khi chưa đăng nhập**; thiếu hoặc sai thì 403 `forbidden`. Mỗi lần đăng nhập (mật
    khẩu, tạo khách, Google) cookie `csrftoken` đổi giá trị, nên đọc lại cookie trước mỗi request.

    Đăng nhập Google không phải JSON mà là luồng chuyển trang của trình duyệt
    (`/accounts/google/login/`), cuối luồng trình duyệt về trang web
    `FRONTEND_URL/account?google=ok` hoặc `FRONTEND_URL/account?error=<mã>` (mã: `GoogleError`).

    Dò email: `signup`, `upgrade` và Google trả thẳng `email_taken`, nên ai cũng biết được một
    email đã đăng ký hay chưa (chấp nhận được cho nhóm bạn). `resend` và `password/forgot` trả
    cùng một câu trả lời, nhưng không cố che chênh lệch thời gian khi có gửi email.

    Kiểu dữ liệu dùng chung với WebSocket (`RoomInfo`, `SeatOccupant`, `TableState`) lấy thẳng từ
    `schema/common.schema.json` để hai phía không lệch nhau. Giao thức WebSocket:
    `ws-protocol.md`.
servers:
  - url: http://localhost:8000
    description: Máy dev
security:
  - session: []
tags:
  - name: rooms
    description: Phòng chơi
  - name: seats
    description: Ghế trong phòng
  - name: auth
    description: Tài khoản (B6) — email/mật khẩu, khách, nâng cấp khách, Google
  - name: history
    description: Chat, lịch sử ván, replay, bảng lời/lỗ (B8)
  - name: feedback
    description: Phản hồi của người chơi và lỗi trình duyệt (F, buổi beta). Chỉ ghi.
paths:
  /api/rooms/:
    get:
      tags: [rooms]
      operationId: listRooms
      summary: Lobby
      description: |
        Phòng chưa đóng mà người gọi được thấy: mọi phòng public, cộng phòng private mà người gọi là
        chủ hoặc đã vào bằng link mời. Mới tạo trước. Không cần đăng nhập (chưa đăng nhập thì chỉ
        thấy phòng public).
      x-phase: B7
      security: [{}, {session: []}]
      responses:
        "200":
          description: Danh sách phòng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lobby"
    post:
      tags: [rooms]
      operationId: createRoom
      summary: Tạo phòng
      description: |
        Người gọi (kể cả khách) thành chủ phòng. Phòng mới ở trạng thái `open`, chưa ai ngồi, chưa ai
        có chip: chủ phòng cấp chip bằng `grantChips` sau khi người chơi vào ghế. Phòng private chỉ
        người có link mời (`invite_token`) mới thấy. Giới hạn 10 phòng/giờ mỗi người.
      x-phase: B7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
            example:
              name: Bàn bạn bè
              max_seats: 9
              small_blind: 5
              big_blind: 10
              think_time_seconds: 20
              seven_deuce_bonus: 50
              is_private: true
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/rooms/join/:
    post:
      tags: [rooms]
      operationId: joinRoom
      summary: Vào phòng bằng link mời
      description: |
        Trang web mở link `FRONTEND_URL/rooms/join?token=...` rồi gọi API này. Người gọi thành thành
        viên của phòng (thấy phòng private, vào ghế được). Chưa đăng nhập thì server tạo khách và đăng
        nhập luôn, như khi mở bàn. Mã sai hoặc đã bị chủ phòng đổi: `room_not_found`.
      x-phase: B7
      security: [{}, {session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRoomRequest"
      responses:
        "200":
          description: Đã vào phòng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/rooms/{room_id}/:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [rooms]
      operationId: getRoom
      summary: Xem phòng
      description: Phòng private mà người gọi không có quyền xem thì trả `room_not_found` như phòng không tồn tại.
      x-phase: B7
      security: [{}, {session: []}]
      responses:
        "200":
          description: Phòng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [rooms]
      operationId: updateRoom
      summary: Chủ phòng đổi cấu hình
      description: |
        Chỉ chủ phòng (`forbidden` với người khác). Đang có ván thì ván đó giữ cấu hình cũ: thay đổi
        nằm trong `pending` và có hiệu lực từ ván sau; cả bàn nhận `room.updated` lúc đó. Không có ván
        thì có hiệu lực ngay. `small_blind` phải nhỏ hơn `big_blind` (tính cả giá trị đang có).
      x-phase: B7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoomRequest"
            example:
              small_blind: 10
              big_blind: 20
      responses:
        "200":
          description: Đã nhận; xem `room` (đang áp dụng) và `pending` (chờ ván sau)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/rooms/{room_id}/chips/:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      tags: [rooms]
      operationId: grantChips
      summary: Chủ phòng cấp hoặc điều chỉnh chip
      description: |
        Chỉ chủ phòng. Ghi một bút toán `grant` vào sổ chip của phòng; `amount` âm là trừ bớt (không
        được làm số dư âm: `negative_balance`). Người nhận phải đang ngồi ghế (`not_seated`) và không ở
        trong ván đang chạy (`player_in_hand`). Cả bàn nhận `seat.updated` với `stack` mới.
      x-phase: B7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantChipsRequest"
            example:
              player_id: "7"
              amount: 1000
      responses:
        "200":
          description: Đã ghi sổ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantChipsResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/rooms/{room_id}/kick/:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      tags: [rooms]
      operationId: kickPlayer
      summary: Chủ phòng mời một người ra khỏi phòng
      description: |
        Chỉ chủ phòng, không kick được chính mình. Người đó rời ghế (chip vẫn nằm trong sổ của phòng),
        mất quyền xem phòng private, mọi kết nối WebSocket của họ bị đóng (mã 4403), và không vào lại
        được (`kicked`). Đang trong ván thì từ chối `player_in_hand`: đợi ván xong.
        Phòng private: link mời đổi luôn (link cũ hết hiệu lực), để người đó không quay lại bằng một
        tài khoản khách mới qua link cũ; chủ phòng gửi link mới cho ai còn cần. Phòng public: chỉ chặn
        được tài khoản đó, không chặn được người đó mở một tài khoản khách mới (không chặn theo IP).
      x-phase: B7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerRequest"
      responses:
        "204":
          description: Đã kick
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/rooms/{room_id}/close/:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      tags: [rooms]
      operationId: closeRoom
      summary: Chủ phòng đóng phòng
      description: |
        Chỉ chủ phòng. Không có ván thì đóng ngay (200). Đang có ván thì đóng khi ván xong (202,
        `closing: true`). Phòng đóng: không chia ván mới, không vào ghế được, biến khỏi lobby; sổ chip
        và lịch sử giữ nguyên. Cả bàn nhận `room.updated` với `status: "closed"`.
      x-phase: B7
      responses:
        "200":
          description: Đã đóng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomDetail"
        "202":
          description: Sẽ đóng khi ván đang chạy xong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/rooms/{room_id}/invite/:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      tags: [rooms]
      operationId: rotateInvite
      summary: Chủ phòng đổi link mời
      description: Tạo `invite_token` mới; link cũ hết hiệu lực ngay (người đã vào phòng vẫn giữ quyền).
      x-phase: B7
      responses:
        "200":
          description: Link mới
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/rooms/{room_id}/seats/:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      tags: [seats]
      operationId: takeSeat
      summary: Vào ghế (dự kiến B4)
      description: |
        Người gọi ngồi vào một ghế trống. Được dealt từ ván kế tiếp nếu có chip trong phòng.
        Cả bàn nhận `seat.updated` qua WebSocket. Phòng private cần quyền xem (`room_not_found`);
        người đã bị kick nhận `kicked`; phòng đã đóng nhận `room_closed`; phòng tạm dừng nhận
        `room_suspended`. Chưa đăng nhập thì server tạo khách và đăng nhập luôn (tối đa 20 khách/giờ
        mỗi IP, quá thì `rate_limited`); điều này đúng cho mọi API của bàn và cho WebSocket.
      x-phase: B4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TakeSeatRequest"
            example:
              seat: 3
      responses:
        "201":
          description: Đã ngồi
          content:
            application/json:
              schema:
                $ref: "./schema/common.schema.json#/$defs/SeatOccupant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/rooms/{room_id}/seats/me/:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    delete:
      tags: [seats]
      operationId: leaveSeat
      summary: Rời ghế (dự kiến B4)
      description: |
        Không được rời khi còn trong ván đang chạy (`player_in_hand`); hãy sit-out qua WebSocket
        rồi rời sau. Chip vẫn thuộc phòng, vào lại vẫn còn. Cả bàn nhận `seat.updated`.
      x-phase: B4
      responses:
        "204":
          description: Đã rời ghế
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/rooms/{room_id}/snapshot/:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [rooms]
      operationId: getTableSnapshot
      summary: Lấy trạng thái bàn (dự kiến B4)
      description: |
        Giống `table.snapshot` của WebSocket, đã che bài theo góc nhìn người gọi. Dùng để vẽ
        trang lần đầu trước khi mở WebSocket; sau đó WebSocket là nguồn cập nhật.
      x-phase: B4
      responses:
        "200":
          description: Trạng thái bàn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableSnapshot"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/config/:
    get:
      tags: [auth]
      operationId: getAuthConfig
      summary: Cấu hình màn đăng nhập
      description: Cho biết có bật Google không, và đặt cookie `csrftoken`. Gọi đầu tiên khi mở trang.
      x-phase: B6
      security: [{}]
      responses:
        "200":
          description: Cấu hình
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"
  /api/auth/me/:
    get:
      tags: [auth]
      operationId: getMe
      summary: Người đang đăng nhập
      x-phase: B6
      responses:
        "200":
          description: Tài khoản của phiên này
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/auth/signup/:
    post:
      tags: [auth]
      operationId: signup
      summary: Đăng ký bằng email và mật khẩu
      description: |
        Tạo tài khoản chưa xác minh và gửi email có link xác minh
        (`FRONTEND_URL/account/verify?token=...`). **Không** đăng nhập luôn: phải xác minh email
        trước. Khách muốn giữ chip thì dùng `upgrade`, không dùng `signup`. Server mail lỗi thì
        vẫn trả 201 (đã tạo tài khoản); người dùng xin gửi lại link bằng `resend`.
      x-phase: B6
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Đã tạo, đã gửi email xác minh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/verify-email/:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Xác minh email bằng token trong link
      description: Token hết hạn sau 3 ngày, và không dùng được nữa khi email của tài khoản đã đổi.
      x-phase: B6
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Đã xác minh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/auth/verify-email/resend/:
    post:
      tags: [auth]
      operationId: resendVerificationEmail
      summary: Gửi lại link xác minh
      description: Luôn trả 202, có tài khoản chưa xác minh với email đó hay không.
      x-phase: B6
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Đã nhận
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/login/:
    post:
      tags: [auth]
      operationId: login
      summary: Đăng nhập bằng email và mật khẩu
      description: |
        Sai email hay sai mật khẩu đều trả `invalid_credentials`. Email chưa xác minh:
        `email_not_verified` (403). Giới hạn: 20 lần/10 phút mỗi IP; 5 lần sai/15 phút cho một
        email từ một IP; 30 lần sai/giờ cho một email từ mọi IP. Quá thì `rate_limited`, kể cả khi
        mật khẩu đúng.
      x-phase: B6
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Đã đăng nhập, cookie `sessionid` mới
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/logout/:
    post:
      tags: [auth]
      operationId: logout
      summary: Đăng xuất
      description: Khách đăng xuất là mất tài khoản khách (không có cách đăng nhập lại).
      x-phase: B6
      security: [{}, {session: []}]
      responses:
        "204":
          description: Đã đăng xuất
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/auth/password/forgot/:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Quên mật khẩu — gửi link đặt lại
      description: |
        Luôn trả 202, có tài khoản hay không. Link `FRONTEND_URL/account/reset?uid=...&token=...`
        dùng một lần, hết hạn sau 1 giờ. Giới hạn: 5 lần/giờ mỗi IP, 3 lần/giờ mỗi email.
      x-phase: B6
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Đã nhận
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/password/reset/:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Đặt mật khẩu mới bằng link trong email
      description: Thành công thì email của tài khoản cũng được coi là đã xác minh. Không tự đăng nhập.
      x-phase: B6
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Đã đổi mật khẩu
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/auth/guest/:
    post:
      tags: [auth]
      operationId: createGuest
      summary: Chơi ngay bằng tài khoản khách
      description: |
        Tạo `User` với `is_guest=true` và đăng nhập luôn. Không đặt tên thì tên là `khach-xxxxxx`.
        Đang có phiên rồi thì trả 200 với chính tài khoản đó, không tạo thêm. Giới hạn 20 khách/giờ
        mỗi IP.
      x-phase: B6
      security: [{}, {session: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestRequest"
      responses:
        "200":
          description: Đã có phiên, trả tài khoản hiện tại
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "201":
          description: Đã tạo khách và đăng nhập
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/upgrade/:
    post:
      tags: [auth]
      operationId: upgradeGuest
      summary: Nâng cấp khách lên tài khoản email/mật khẩu
      description: |
        Gắn email + mật khẩu vào **chính** `User` khách đang đăng nhập (giữ nguyên `id`), nên chip
        và lịch sử ván ở mọi phòng giữ nguyên. Vẫn đăng nhập sau khi nâng cấp; email gửi link xác
        minh như `signup`. Email đã thuộc tài khoản khác: `email_taken`, không gộp tài khoản.
        Không phải khách: `not_guest`. Nâng cấp bằng Google: xem `/accounts/google/login/`.
      x-phase: B6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeRequest"
      responses:
        "200":
          description: Đã nâng cấp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /accounts/google/login/:
    post:
      tags: [auth]
      operationId: startGoogleLogin
      summary: Bắt đầu đăng nhập (hoặc nâng cấp khách) bằng Google
      description: |
        **Form của trình duyệt, không phải fetch**: trang web submit một `<form method="post">`
        (có `csrfmiddlewaretoken`), server chuyển trình duyệt sang Google rồi Google chuyển về
        `/accounts/google/login/callback/`. Cuối cùng trình duyệt về `FRONTEND_URL/account` với
        `?google=ok` (đã đăng nhập, tài khoản mới hoặc cũ, hoặc khách đã nâng cấp) hoặc
        `?error=<GoogleError>`. Mở thẳng URL này bằng GET thì chỉ quay về `FRONTEND_URL/account`.
        Chỉ nhận email Google đánh dấu đã xác minh.

        `process=connect` khi khách đang đăng nhập muốn nâng cấp: Google được gắn vào chính `User`
        khách (giữ `id`, chip, lịch sử), email Google coi như đã xác minh.
      x-phase: B6
      security: [{}, {session: []}]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/GoogleLoginForm"
      responses:
        "302":
          description: Chuyển sang Google, hoặc về trang web với `?error=google_disabled`
  /api/rooms/{room_id}/chat/:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [history]
      operationId: getChatHistory
      summary: 50 dòng chat gần nhất
      description: Cũ trước, mới sau. Dòng mới tới qua WebSocket `chat.message`. Cần quyền xem phòng như `getRoom` (`room_not_found` nếu không, `kicked` nếu đã bị kick).
      x-phase: B8
      security: [{}, {session: []}]
      responses:
        "200":
          description: Chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatHistory"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/rooms/{room_id}/hands/:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [history]
      operationId: listHands
      summary: Lịch sử ván của phòng
      description: |
        100 ván đã xong gần nhất, mới trước. Ván đang chơi không có ở đây. Ván bị người quản trị huỷ
        (`void_hand`) có `voided: true` và không ai có lời/lỗ. Cần quyền xem phòng như `getRoom` (`room_not_found` nếu không, `kicked` nếu đã bị kick).
      x-phase: B8
      security: [{}, {session: []}]
      responses:
        "200":
          description: Các ván
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/rooms/{room_id}/summary/:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [history]
      operationId: getRoomSummary
      summary: Bảng tổng kết lời/lỗ
      description: |
        Mỗi người từng có chip trong phòng: đã được cấp bao nhiêu, thắng/thua bao nhiêu ở các ván,
        thưởng 7-2 nhận/trả, số dư hiện tại và lời/lỗ (`net` = số dư − đã cấp). Tính từ sổ chip;
        tổng `net` của cả phòng luôn bằng 0. Cần quyền xem phòng như `getRoom` (`room_not_found` nếu không, `kicked` nếu đã bị kick).
      x-phase: B8
      security: [{}, {session: []}]
      responses:
        "200":
          description: Bảng tổng kết
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/hands/{hand_id}/replay/:
    parameters:
      - name: hand_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [history]
      operationId: getHandReplay
      summary: Xem lại một ván từng bước
      description: |
        Dựng lại ván từ cấu hình và các lệnh đã lưu. Mỗi bước là `HandView` **theo góc nhìn người
        gọi tại thời điểm đó**: chỉ thấy bài của chính mình (nếu đã ngồi ván đó) và bài đã lật tới
        bước đó; bài úp của người khác luôn là `"??"`. Chỉ ván đã xong (`hand_not_found` cho ván đang
        chơi hoặc không có quyền xem); ván đã huỷ: `hand_voided`. `legal_actions` luôn `null`.
      x-phase: B8
      security: [{}, {session: []}]
      responses:
        "200":
          description: Các bước
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandReplay"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/feedback/:
    post:
      tags: [feedback]
      operationId: sendFeedback
      summary: Gửi phản hồi (lỗi, ý tưởng, khác)
      description: |
        Phải đăng nhập, khách cũng được. Tối đa 10 lần mỗi giờ mỗi người. `room_id` là phòng đang
        chơi (nếu có); phòng không có hoặc không được xem đều báo `validation_error` ở `room_id`.
        Server tự ghi trình duyệt (`User-Agent`); token trong `page` và `message` (link mời, link
        đặt lại mật khẩu dán vào) bị xoá trước khi lưu. Không có endpoint đọc lại.
      x-phase: F
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
            example:
              kind: bug
              message: Bấm Theo hai lần mới ăn.
              page: /rooms/3/table
              room_id: 3
      responses:
        "201":
          description: Đã nhận
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/client-errors/:
    post:
      tags: [feedback]
      operationId: reportClientError
      summary: Báo một lỗi JavaScript của trình duyệt
      description: |
        Không cần đăng nhập. Tối đa 30 lần/10 phút mỗi người (nếu đã đăng nhập, kiểm trước) và 60
        lần/10 phút mỗi IP; cả server nhận tối đa 1000 lỗi **mới** mỗi 24 giờ. Quá các mức này đều
        trả `rate_limited` (429) với `Retry-After`. Trường dài hơn giới hạn bị cắt bớt, không bị
        từ chối. Cùng `message`, `page` và `release` trong cùng khung 10 phút cố định (10:00–10:10…)
        chỉ tăng bộ đếm, không lưu thêm dòng, kể cả khi hai báo cáo tới cùng lúc. Trước khi lưu,
        server xoá cookie, header `Cookie` / `X-CSRFToken`, `sessionid`, `csrftoken`, token trong
        link hay trong JSON (`"invite_token": …`) và danh sách lá bài khỏi mọi trường; client cũng
        không được gửi chúng. Không có endpoint đọc lại.
      x-phase: F
      security: [{}, {session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientErrorReport"
      responses:
        "204":
          description: Đã nhận (hoặc đã cộng vào lỗi giống hệt trong cùng khung 10 phút)
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: sessionid
      description: Cookie phiên Django (B6). Request không phải GET cần thêm header `X-CSRFToken`.
  parameters:
    RoomId:
      name: room_id
      in: path
      required: true
      schema:
        $ref: "./schema/common.schema.json#/$defs/RoomId"
  schemas:
    FeedbackRequest:
      type: object
      properties:
        kind:
          type: string
          enum: [bug, idea, other]
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: Bỏ khoảng trắng hai đầu rồi tính độ dài; toàn khoảng trắng là thiếu.
        page:
          type: string
          maxLength: 500
          description: Đường dẫn trang lúc gửi, ví dụ `/rooms/3/table`.
        room_id:
          type: [integer, "null"]
          minimum: 1
      required: [kind, message]
      additionalProperties: false
    FeedbackCreated:
      type: object
      properties:
        feedback_id:
          type: integer
      required: [feedback_id]
      additionalProperties: false
    ClientErrorReport:
      type: object
      description: Trường nào dài hơn giới hạn thì server cắt bớt.
      properties:
        message:
          type: string
          minLength: 1
          description: Server giữ tối đa 1000 ký tự.
        stack:
          type: string
          description: Server giữ tối đa 8000 ký tự.
        page:
          type: string
          description: Server giữ tối đa 500 ký tự.
        user_agent:
          type: string
          description: Trống thì server lấy header `User-Agent`. Tối đa 500 ký tự.
        release:
          type: string
          description: Phiên bản web đang chạy. Tối đa 64 ký tự.
      required: [message]
      additionalProperties: false
    CreateRoomRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        max_seats:
          type: integer
          minimum: 2
          maximum: 9
          default: 9
        small_blind:
          type: integer
          minimum: 1
        big_blind:
          type: integer
          minimum: 2
          description: Phải lớn hơn `small_blind`.
        think_time_seconds:
          type: integer
          minimum: 5
          maximum: 120
          default: 30
        seven_deuce_bonus:
          type: integer
          minimum: 0
          default: 0
          description: Thưởng luật 7-2 (#27); 0 là tắt.
        is_private:
          type: boolean
          default: false
          description: Phòng private không hiện ở lobby; chỉ chủ phòng và người có link mời thấy.
      required: [name, small_blind, big_blind]
      additionalProperties: false
    Lobby:
      type: object
      properties:
        rooms:
          type: array
          items:
            $ref: "#/components/schemas/LobbyRoom"
      required: [rooms]
      additionalProperties: false
    LobbyRoom:
      type: object
      properties:
        room:
          $ref: "./schema/common.schema.json#/$defs/RoomInfo"
        is_private:
          type: boolean
        owner_name:
          type: [string, "null"]
        seated:
          type: integer
          minimum: 0
          maximum: 9
          description: Số ghế đang có người.
      required: [room, is_private, owner_name, seated]
      additionalProperties: false
    RoomDetail:
      type: object
      properties:
        room:
          $ref: "./schema/common.schema.json#/$defs/RoomInfo"
        is_private:
          type: boolean
        owner_id:
          type: [string, "null"]
          description: Cùng dạng `player_id` ở WebSocket.
        owner_name:
          type: [string, "null"]
        is_owner:
          type: boolean
          description: Người gọi có phải chủ phòng không.
        invite_token:
          type: [string, "null"]
          description: Chỉ chủ phòng thấy; người khác nhận `null`. Link mời là `FRONTEND_URL/rooms/join?token=<invite_token>`.
        pending:
          description: Cấu hình chủ phòng đã đổi nhưng chờ ván sau; `null` nếu không có.
          anyOf:
            - $ref: "#/components/schemas/UpdateRoomRequest"
            - type: "null"
        closing:
          type: boolean
          description: Chủ phòng đã đóng phòng, chờ ván đang chạy xong.
      required: [room, is_private, owner_id, owner_name, is_owner, invite_token, pending, closing]
      additionalProperties: false
    UpdateRoomRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        small_blind:
          type: integer
          minimum: 1
        big_blind:
          type: integer
          minimum: 2
        think_time_seconds:
          type: integer
          minimum: 5
          maximum: 120
        seven_deuce_bonus:
          type: integer
          minimum: 0
      additionalProperties: false
    JoinRoomRequest:
      type: object
      properties:
        invite_token:
          type: string
          minLength: 1
          maxLength: 64
      required: [invite_token]
      additionalProperties: false
    GrantChipsRequest:
      type: object
      properties:
        player_id:
          $ref: "./schema/common.schema.json#/$defs/PlayerId"
        amount:
          type: integer
          not:
            const: 0
          description: Dương là cấp thêm, âm là trừ bớt.
      required: [player_id, amount]
      additionalProperties: false
    GrantChipsResult:
      type: object
      properties:
        player_id:
          $ref: "./schema/common.schema.json#/$defs/PlayerId"
        amount:
          type: integer
        balance:
          $ref: "./schema/common.schema.json#/$defs/Chips"
      required: [player_id, amount, balance]
      additionalProperties: false
    PlayerRequest:
      type: object
      properties:
        player_id:
          $ref: "./schema/common.schema.json#/$defs/PlayerId"
      required: [player_id]
      additionalProperties: false
    TakeSeatRequest:
      type: object
      properties:
        seat:
          $ref: "./schema/common.schema.json#/$defs/SeatNumber"
      required: [seat]
      additionalProperties: false
    TableSnapshot:
      type: object
      description: Cùng nội dung với `payload.table` và `version` của `table.snapshot` trên WebSocket.
      properties:
        version:
          $ref: "./schema/common.schema.json#/$defs/Version"
        server_time:
          $ref: "./schema/common.schema.json#/$defs/ServerTime"
        table:
          $ref: "./schema/common.schema.json#/$defs/TableState"
      required: [version, server_time, table]
      additionalProperties: false
    AuthConfig:
      type: object
      properties:
        google_enabled:
          type: boolean
          description: "`false` khi server chưa có `GOOGLE_CLIENT_ID`/`GOOGLE_CLIENT_SECRET`: ẩn nút Google."
      required: [google_enabled]
      additionalProperties: false
    Me:
      type: object
      properties:
        id:
          type: integer
          description: Không đổi khi khách nâng cấp.
        username:
          type: string
          description: Tên hiện ở bàn chơi.
        email:
          type: [string, "null"]
          format: email
          description: "`null` với khách."
        is_guest:
          type: boolean
        email_verified:
          type: boolean
        has_password:
          type: boolean
          description: "`false` với khách và người chỉ đăng nhập bằng Google."
        google_connected:
          type: boolean
      required: [id, username, email, is_guest, email_verified, has_password, google_connected]
      additionalProperties: false
    Username:
      type: string
      minLength: 2
      maxLength: 30
      description: Chữ (kể cả tiếng Việt), số và `@ . + - _`, không có dấu cách. Không phân biệt hoa thường khi so trùng.
    Password:
      type: string
      maxLength: 128
      description: Theo bộ kiểm tra mật khẩu của Django (tối thiểu 8 ký tự, không quá phổ biến, không toàn số, không giống tên/email).
    SignupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
      required: [email, username, password]
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          maxLength: 128
      required: [email, password]
      additionalProperties: false
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required: [email]
      additionalProperties: false
    TokenRequest:
      type: object
      properties:
        token:
          type: string
          maxLength: 512
          description: Tham số `token` của link trong email.
      required: [token]
      additionalProperties: false
    ResetPasswordRequest:
      type: object
      properties:
        uid:
          type: string
          maxLength: 64
          description: Tham số `uid` của link trong email.
        token:
          type: string
          maxLength: 128
          description: Tham số `token` của link trong email.
        password:
          $ref: "#/components/schemas/Password"
      required: [uid, token, password]
      additionalProperties: false
    GuestRequest:
      type: object
      properties:
        username:
          $ref: "#/components/schemas/Username"
      additionalProperties: false
    UpgradeRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          $ref: "#/components/schemas/Password"
        username:
          $ref: "#/components/schemas/Username"
      required: [email, password]
      additionalProperties: false
    GoogleLoginForm:
      type: object
      properties:
        process:
          type: string
          enum: [login, connect]
          default: login
          description: "`connect` để khách đang đăng nhập nâng cấp bằng Google."
        csrfmiddlewaretoken:
          type: string
          description: Giá trị cookie `csrftoken`.
      required: [csrfmiddlewaretoken]
    GoogleError:
      type: string
      description: |
        Mã trong `FRONTEND_URL/account?error=<mã>` khi luồng Google không xong.

        - `google_disabled` — server chưa có key Google.
        - `google_failed` — người dùng huỷ ở Google, Google báo lỗi, hoặc form sai `process`.
        - `email_taken` — email Google đã thuộc một tài khoản khác (không gộp tài khoản).
        - `email_not_verified` — Google chưa xác minh email của tài khoản Google đó.
        - `social_account_taken` — (nâng cấp) tài khoản Google này đã gắn với người khác.
        - `not_guest` — (nâng cấp) người đang đăng nhập không phải khách.
        - `account_inactive` — tài khoản đã bị admin khoá.
      enum:
        - google_disabled
        - google_failed
        - email_taken
        - email_not_verified
        - social_account_taken
        - not_guest
        - account_inactive
    ChatHistory:
      type: object
      properties:
        messages:
          type: array
          maxItems: 50
          items:
            $ref: "./schema/common.schema.json#/$defs/ChatMessage"
      required: [messages]
      additionalProperties: false
    HandList:
      type: object
      properties:
        hands:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/HandSummary"
      required: [hands]
      additionalProperties: false
    HandSummary:
      type: object
      properties:
        hand_id:
          type: integer
          minimum: 1
        hand_no:
          type: integer
          minimum: 1
        completed_at:
          $ref: "./schema/common.schema.json#/$defs/ServerTime"
        voided:
          type: boolean
        players:
          type: array
          items:
            type: object
            properties:
              player_id:
                $ref: "./schema/common.schema.json#/$defs/PlayerId"
              display_name:
                type: string
              seat:
                description: "`null` với người không được chia bài mà vẫn có bút toán (đang nghỉ nhưng phải trả thưởng 7-2)."
                anyOf:
                  - $ref: "./schema/common.schema.json#/$defs/SeatNumber"
                  - type: "null"
              net:
                type: integer
                description: Lời (+) / lỗ (−) của ván, gồm cả thưởng 7-2. Tổng cả ván bằng 0.
            required: [player_id, display_name, seat, net]
            additionalProperties: false
      required: [hand_id, hand_no, completed_at, voided, players]
      additionalProperties: false
    HandReplay:
      type: object
      properties:
        hand_id:
          type: integer
          minimum: 1
        hand_no:
          type: integer
          minimum: 1
        room_id:
          $ref: "./schema/common.schema.json#/$defs/RoomId"
        completed_at:
          $ref: "./schema/common.schema.json#/$defs/ServerTime"
        steps:
          type: array
          minItems: 1
          description: Bước đầu là lúc vừa chia bài (`action` null); mỗi bước sau là một hành động đã áp.
          items:
            type: object
            properties:
              action:
                anyOf:
                  - $ref: "./schema/common.schema.json#/$defs/AppliedAction"
                  - type: "null"
              hand:
                $ref: "./schema/common.schema.json#/$defs/HandView"
            required: [action, hand]
            additionalProperties: false
        results:
          type: array
          description: |
            Mọi người có bút toán trong ván này, kể cả người đang nghỉ (sit-out) mà phải trả thưởng
            7-2. Tổng `hand_net + seven_deuce_net` của cả ván luôn bằng 0.
          items:
            type: object
            properties:
              player_id:
                $ref: "./schema/common.schema.json#/$defs/PlayerId"
              display_name:
                type: string
              hand_net:
                type: integer
              seven_deuce_net:
                type: integer
            required: [player_id, display_name, hand_net, seven_deuce_net]
            additionalProperties: false
        seven_deuce_winner:
          description: Người ăn thưởng luật 7-2 ở ván này (#27), `null` nếu không có.
          anyOf:
            - $ref: "./schema/common.schema.json#/$defs/PlayerId"
            - type: "null"
        showdown:
          type: array
          description: |
            Bộ bài của từng người còn ngửa bài sau showdown (như `hand.completed.payload.showdown`),
            theo số ghế; `[]` nếu ván kết thúc vì mọi người bỏ bài (kể cả khi lật 7-2).
          items:
            $ref: "./schema/common.schema.json#/$defs/ShowdownHand"
        prev_hand:
          description: Ván xong (không bị huỷ) ngay trước ván này trong phòng, theo số ván; `null` nếu không có. Không giới hạn trong 100 ván của danh sách.
          anyOf:
            - $ref: "#/components/schemas/HandLink"
            - type: "null"
        next_hand:
          description: Ván xong (không bị huỷ) ngay sau ván này; `null` nếu không có.
          anyOf:
            - $ref: "#/components/schemas/HandLink"
            - type: "null"
      required: [hand_id, hand_no, room_id, completed_at, steps, results, seven_deuce_winner, showdown, prev_hand, next_hand]
      additionalProperties: false
    HandLink:
      type: object
      properties:
        hand_id:
          type: integer
          minimum: 1
        hand_no:
          type: integer
          minimum: 1
      required: [hand_id, hand_no]
      additionalProperties: false
    RoomSummary:
      type: object
      properties:
        players:
          type: array
          items:
            type: object
            properties:
              player_id:
                $ref: "./schema/common.schema.json#/$defs/PlayerId"
              display_name:
                type: string
              granted:
                type: integer
                description: Tổng chip chủ phòng đã cấp (trừ đi phần đã trừ bớt).
              hands_net:
                type: integer
                description: Thắng (+) / thua (−) ở các ván.
              seven_deuce_net:
                type: integer
              balance:
                $ref: "./schema/common.schema.json#/$defs/Chips"
              net:
                type: integer
                description: Lời/lỗ = balance − granted = hands_net + seven_deuce_net.
              hands_played:
                type: integer
                minimum: 0
            required: [player_id, display_name, granted, hands_net, seven_deuce_net, balance, net, hands_played]
            additionalProperties: false
      required: [players]
      additionalProperties: false
    ApiError:
      type: object
      properties:
        code:
          type: string
          enum:
            - validation_error
            - not_authenticated
            - forbidden
            - room_not_found
            - room_closed
            - invalid_seat
            - seat_taken
            - already_seated
            - not_seated
            - player_in_hand
            - rate_limited
            - invalid_credentials
            - email_not_verified
            - email_taken
            - username_taken
            - invalid_token
            - not_guest
            - method_not_allowed
            - invalid_amount
            - negative_balance
            - kicked
            - hand_not_found
            - hand_voided
            - room_suspended
          description: Mã ổn định, client được phép `switch` theo mã.
        message:
          type: string
          description: Để đọc log, không hiện cho người chơi.
        fields:
          type: object
          description: Chỉ có khi `validation_error`, lỗi theo từng trường của body.
          additionalProperties:
            type: array
            items:
              type: string
      required: [code, message]
      additionalProperties: false
  responses:
    BadRequest:
      description: Body sai (`validation_error`, `invalid_seat`, `invalid_credentials`, `invalid_token`, `invalid_amount`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthenticated:
      description: Chưa đăng nhập (`not_authenticated`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Thiếu/sai CSRF token hoặc không phải chủ phòng (`forbidden`), email chưa xác minh (`email_not_verified`), đã bị chủ phòng kick (`kicked`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Không có phòng hoặc không được xem phòng này (`room_not_found`); không có ván, ván chưa xong hoặc không được xem (`hand_not_found`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Trạng thái không cho phép (`seat_taken`, `already_seated`, `not_seated`, `player_in_hand`, `room_closed`, `email_taken`, `username_taken`, `not_guest`, `negative_balance`, `hand_voided`, `room_suspended`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RateLimited:
      description: Gọi quá nhanh (`rate_limited`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
