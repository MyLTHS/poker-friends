openapi: 3.1.0
info:
  title: Poker Friends REST API
  version: 0.1.0
  description: |
    Đặc tả REST tối thiểu (đợt B3). **Chưa có endpoint nào được cài**: đây là hợp đồng để
    frontend làm trước trên mock. Mỗi thao tác có `x-phase` cho biết đợt nào sẽ cài:

    - `B4`: cần để chơi realtime (vào ghế, rời ghế, lấy snapshot).
    - `B7`: phòng và quyền (tạo phòng, xem phòng; quyền chủ phòng, phòng private, link mời).

    Đăng nhập (B6) dùng cookie phiên của Django (`sessionid`) và CSRF token cho mọi request
    không phải GET. Trước B6, B4 dùng tạm tài khoản khách.

    Kiểu dữ liệu dùng chung với WebSocket (`RoomInfo`, `SeatOccupant`, `TableState`) lấy thẳng từ
    `schema/common.schema.json` để hai phía không lệch nhau. Giao thức WebSocket:
    `ws-protocol.md`.
servers:
  - url: http://localhost:8000
    description: Máy dev
security:
  - session: []
tags:
  - name: rooms
    description: Phòng chơi
  - name: seats
    description: Ghế trong phòng
paths:
  /api/rooms/:
    post:
      tags: [rooms]
      operationId: createRoom
      summary: Tạo phòng (dự kiến B7)
      description: Người gọi thành chủ phòng. Phòng mới ở trạng thái `open`, chưa ai ngồi.
      x-phase: B7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
            example:
              name: Bàn bạn bè
              max_seats: 9
              small_blind: 5
              big_blind: 10
              think_time_seconds: 20
              seven_deuce_bonus: 50
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: "./schema/common.schema.json#/$defs/RoomInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/rooms/{room_id}/:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [rooms]
      operationId: getRoom
      summary: Xem cấu hình phòng (dự kiến B7)
      x-phase: B7
      responses:
        "200":
          description: Cấu hình phòng
          content:
            application/json:
              schema:
                $ref: "./schema/common.schema.json#/$defs/RoomInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/rooms/{room_id}/seats/:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      tags: [seats]
      operationId: takeSeat
      summary: Vào ghế (dự kiến B4)
      description: |
        Người gọi ngồi vào một ghế trống. Được dealt từ ván kế tiếp nếu có chip trong phòng.
        Cả bàn nhận `seat.updated` qua WebSocket.
      x-phase: B4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TakeSeatRequest"
            example:
              seat: 3
      responses:
        "201":
          description: Đã ngồi
          content:
            application/json:
              schema:
                $ref: "./schema/common.schema.json#/$defs/SeatOccupant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/rooms/{room_id}/seats/me/:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    delete:
      tags: [seats]
      operationId: leaveSeat
      summary: Rời ghế (dự kiến B4)
      description: |
        Không được rời khi còn trong ván đang chạy (`player_in_hand`); hãy sit-out qua WebSocket
        rồi rời sau. Chip vẫn thuộc phòng, vào lại vẫn còn. Cả bàn nhận `seat.updated`.
      x-phase: B4
      responses:
        "204":
          description: Đã rời ghế
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/rooms/{room_id}/snapshot/:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [rooms]
      operationId: getTableSnapshot
      summary: Lấy trạng thái bàn (dự kiến B4)
      description: |
        Giống `table.snapshot` của WebSocket, đã che bài theo góc nhìn người gọi. Dùng để vẽ
        trang lần đầu trước khi mở WebSocket; sau đó WebSocket là nguồn cập nhật.
      x-phase: B4
      responses:
        "200":
          description: Trạng thái bàn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableSnapshot"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: sessionid
      description: Cookie phiên Django (B6). Request không phải GET cần thêm header `X-CSRFToken`.
  parameters:
    RoomId:
      name: room_id
      in: path
      required: true
      schema:
        $ref: "./schema/common.schema.json#/$defs/RoomId"
  schemas:
    CreateRoomRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        max_seats:
          type: integer
          minimum: 2
          maximum: 9
          default: 9
        small_blind:
          type: integer
          minimum: 1
        big_blind:
          type: integer
          minimum: 2
          description: Phải lớn hơn `small_blind`.
        think_time_seconds:
          type: integer
          minimum: 5
          maximum: 120
          default: 30
        seven_deuce_bonus:
          type: integer
          minimum: 0
          default: 0
          description: Thưởng luật 7-2 (#27); 0 là tắt.
      required: [name, small_blind, big_blind]
      additionalProperties: false
    TakeSeatRequest:
      type: object
      properties:
        seat:
          $ref: "./schema/common.schema.json#/$defs/SeatNumber"
      required: [seat]
      additionalProperties: false
    TableSnapshot:
      type: object
      description: Cùng nội dung với `payload.table` và `version` của `table.snapshot` trên WebSocket.
      properties:
        version:
          $ref: "./schema/common.schema.json#/$defs/Version"
        server_time:
          $ref: "./schema/common.schema.json#/$defs/ServerTime"
        table:
          $ref: "./schema/common.schema.json#/$defs/TableState"
      required: [version, server_time, table]
      additionalProperties: false
    ApiError:
      type: object
      properties:
        code:
          type: string
          enum:
            - validation_error
            - not_authenticated
            - forbidden
            - room_not_found
            - room_closed
            - invalid_seat
            - seat_taken
            - already_seated
            - not_seated
            - player_in_hand
            - rate_limited
          description: Mã ổn định, client được phép `switch` theo mã.
        message:
          type: string
          description: Để đọc log, không hiện cho người chơi.
        fields:
          type: object
          description: Chỉ có khi `validation_error`, lỗi theo từng trường của body.
          additionalProperties:
            type: array
            items:
              type: string
      required: [code, message]
      additionalProperties: false
  responses:
    BadRequest:
      description: Body sai (`validation_error`, `invalid_seat`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthenticated:
      description: Chưa đăng nhập (`not_authenticated`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Không có phòng hoặc không được xem phòng này (`room_not_found`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Trạng thái không cho phép (`seat_taken`, `already_seated`, `not_seated`, `player_in_hand`, `room_closed`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RateLimited:
      description: Gọi quá nhanh (`rate_limited`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
