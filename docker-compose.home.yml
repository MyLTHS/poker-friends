# "Playing from home": the production stack on this Mac, reached through a Cloudflare quick
# tunnel instead of a server with a domain (docs/choi-online.md). Used on top of the production
# file. The first time through scripts/play-online.sh (it creates .env.home and builds):
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.home.yml --env-file .env.home ...
#
# After that the whole game is the "poker-home" group in Docker Desktop: ▶ starts everything,
# the tunnel included, and the link for friends is in the tunnel container's log.
# Everything else (one Daphne, migrations, healthchecks) is the production file unchanged.
# Same log cap as the production file (anchors do not cross files).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

name: poker-home

services:
  db:
    env_file: !override .env.home

  backend:
    env_file: !override .env.home
    image: poker-friends-backend:home

  web:
    image: poker-friends-web:home

  caddy:
    # Plain HTTP on this Mac only: cloudflared does HTTPS, so no certificate and no port open to
    # the local network.
    ports: !override
      - "127.0.0.1:${HOME_PORT:-8080}:80"
    volumes: !override
      - ./deploy/Caddyfile.home:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config

  tools:
    env_file: !override .env.home

  # The public link: a Cloudflare quick tunnel to Caddy. It starts with everything else, so ▶ in
  # Docker Desktop is enough; every start prints a new https://<words>.trycloudflare.com link in
  # this container's log. The backend accepts any *.trycloudflare.com host (.env.home).
  tunnel:
    logging: *logging
    image: cloudflare/cloudflared:2026.10.0
    command: ["tunnel", "--no-autoupdate", "--url", "http://caddy:80"]
    restart: unless-stopped
    depends_on:
      caddy:
        condition: service_started

  # A backup when the game starts (▶ in Docker Desktop too), then every 6 hours while it runs;
  # the 60 newest are kept. An empty database (the very first start) has nothing to back up.
  # pg_dump matches the database.
  autobackup:
    logging: *logging
    image: postgres:17
    env_file: .env.home
    working_dir: /work
    volumes:
      - ./scripts:/work/scripts:ro
      - ./backups:/work/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          n=$$(psql "$$DATABASE_URL" -Atc "SELECT count(*) FROM pg_tables WHERE schemaname = 'public'" 2>/dev/null || echo x)
          case "$$n" in
            x | "") echo "autobackup: database not reachable, trying again in a minute"; sleep 60; continue ;;
            0) echo "autobackup: empty database, nothing to back up" ;;
            *) scripts/backup.sh || echo "autobackup: BACKUP FAILED" ;;
          esac
          # Keep the 60 newest dumps (about two weeks of evenings); older ones go.
          ls -1t backups/poker-*.dump 2>/dev/null | tail -n +61 | xargs -r rm -f
          sleep 21600
        done
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
