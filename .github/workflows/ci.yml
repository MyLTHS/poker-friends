name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: poker
          POSTGRES_USER: poker
          POSTGRES_PASSWORD: poker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U poker -d poker"
          --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgres://poker:poker@localhost:5432/poker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Django checks
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
      - name: Tests
        run: uv run pytest
      - name: Simulation (500 hands, 9 players)
        run: |
          uv run python -m apps.games.engine.simulate --hands 500 --players 9 --seed ${{ github.run_number }} | tee sim.txt
          grep -q " 0 violations" sim.txt
      - name: Simulation with the 7-2 bonus (2000 hands, heads-up)
        run: |
          uv run python -m apps.games.engine.simulate --hands 2000 --players 2 --seven-deuce-bonus 150 --seed ${{ github.run_number }} | tee sim72.txt
          grep -q " 0 violations" sim72.txt

  api-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated TypeScript types match docs/api/
        run: npm run api:check
